name: React Frontend CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  DOCKER_IMAGE_NAME: "threadoria_frontend"
  GAR_LOCATION: "europe-north1" # Finland region
  REPOSITORY: "threadoria-repo" # You need to create this in Artifact Registry
  IMAGE: "threadoria_frontend"
  VM_NAME: "frontend"
  ZONE: "europe-north1-a"

jobs:
  # RetireJS Security Scan
  retirejs-scan:
    name: RetireJS Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run RetireJS
        run: |
          npx retire --outputformat json --outputpath retire-report.json || true
          npx retire --severity high

      - name: Upload RetireJS report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retirejs-report
          path: retire-report.json

  # Snyk Security Scan
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json-file-output=snyk-report.json

      - name: Upload Snyk report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-report
          path: snyk-report.json

  # OWASP Dependency Check
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "react-app"
          path: "."
          format: "HTML"
          out: "dependency-check-report"

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: dependency-check-report

  # SonarQube Code Quality Analysis
  sonarqube-scan:
    name: SonarQube Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=threadoria_frontend
            -Dsonar.organization=saad-ouafir
            -Dsonar.sources=src

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ESLint Code Quality
  eslint-scan:
    name: ESLint Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-report.json || true

      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: eslint-report.json

  # Build, Push to GAR, and Deploy via SSH
  build-and-deploy:
    name: Build and Deploy to GCP
    runs-on: ubuntu-latest
    needs: [retirejs-scan, snyk-scan, sonarqube-scan] # Wait for security scans
    permissions:
      contents: "read"
      id-token: "write" # Required for WIF

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Authenticate using Workload Identity Federation
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "projects/945149895844/locations/global/workloadIdentityPools/threadoria-github/providers/saad-ouafir"
          service_account: "threadoria-app-service-account@threadoria-app-project-ynov.iam.gserviceaccount.com"

      # 2. Setup Gcloud SDK
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      # 3. Configure Docker for Artifact Registry
      - name: "Docker Auth"
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # 4. Build and Push Image
      - name: "Build and Push Container"
        run: |
          DOCKER_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/945149895844/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"
          docker build -t $DOCKER_TAG .
          docker push $DOCKER_TAG

      # 5. SSH and Deploy to Private VM via IAP
      - name: "SSH and Restart Container"
        run: |
          DOCKER_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/945149895844/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"

          gcloud compute ssh ${{ env.VM_NAME }} \
            --project=threadoria-app-project-ynov \
            --zone=${{ env.ZONE }} \
            --tunnel-through-iap \
            --command="
              # Authenticate Docker inside the VM
              sudo gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet
              
              # Stop and remove existing container if it exists
              sudo docker stop frontend-container || true
              sudo docker rm frontend-container || true
              
              # Pull the fresh image
              sudo docker pull $DOCKER_TAG
              
              # Remove dangling images to save space (CCNA-style cleanup)
              sudo docker image prune -af
              
              # Run the new container on Port 80
              sudo docker run -d \
                --name frontend-container \
                -p 80:80 \
                --restart always \
                $DOCKER_TAG
            "
